name: WebUntis Sync

on:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '0 */2 * * *'
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install webuntis ics toml requests

      - name: Create config.toml
        env:
          U_USER: ${{ secrets.UNTIS_USER }}
          U_PASS: ${{ secrets.UNTIS_PASSWORD }}
          U_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
        run: |
          printf '[user]\nserver = "ssges-hamm.webuntis.com"\nusername = "%s"\npassword = "%s"\nschool = "%s"\nclass = ""\n' "$U_USER" "$U_PASS" "$U_SCHOOL" > config.toml

            - name: Run WebUntis script
        run: |
          mkdir -p public
          python main.py config.toml
          python - << 'EOF'
          import re
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          with open("webuntis-timetable.ics", "r", encoding="utf-8") as f:
              content = f.read()

          def fix_time(match):
              prefix, dt_str, z_flag = match.groups()
              dt = datetime.strptime(dt_str, "%Y%m%dT%H%M%S")
              if z_flag == "Z":
                  dt = dt.replace(tzinfo=timezone.utc).astimezone(ZoneInfo("Europe/Berlin"))
              else:
                  dt = dt + timedelta(hours=1)
              return f"{prefix}:{dt.strftime('%Y%m%dT%H%M%S')}"

          content = re.sub(r"(DTSTART|DTEND):(\d{8}T\d{6})(Z?)", fix_time, content)
          with open("public/timetable.ics", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
